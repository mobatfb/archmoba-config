name: Publicar 22000 ideas sociales PTM

on:
  push:
    paths:
      - '.github/workflows/publicar_gentools_22k.yml'
      - 'PTM/gentools/catalogo_22000.csv.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir-catalogo:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Reconstruir CSV
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import csv
          import gzip
          import unicodedata
          from pathlib import Path

          source = Path("PTM/gentools/catalogo_22000.csv.gz.b64")
          target = Path("PTM/gentools/ideas_22000_diferenciadas.csv")
          target.write_bytes(gzip.decompress(base64.b64decode(source.read_text().strip())))

          count = 0
          unique_titles = set()
          categories = set()
          with target.open("r", newline="", encoding="utf-8-sig") as fh:
              reader = csv.DictReader(fh, delimiter=";")
              required = {"id","categoria","tema","titulo","publico","problema",
                          "descripcion","funciones_principales","resultado_esperado",
                          "tipo_app","estado_desarrollo"}
              assert set(reader.fieldnames) == required
              for row in reader:
                  count += 1
                  assert int(row["id"]) == count
                  title = unicodedata.normalize("NFKC", row["titulo"]).casefold().strip()
                  assert title not in unique_titles, f"Duplicado: {title}"
                  unique_titles.add(title)
                  categories.add(row["categoria"])
          assert count == 22000, count
          assert len(categories) == 55, len(categories)
          print(f"OK: {count} ideas, {len(categories)} areas, {target.stat().st_size} bytes")
          PY

      - name: Publicar CSV en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PTM/gentools/ideas_22000_diferenciadas.csv
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "PTM: publish 22000 differentiated project proposals CSV"
          git push
