name: Build PYRION WebP assets

on:
  push:
    paths:
      - ".github/workflows/build_pyrion_assets.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install pillow
      - name: Convert backgrounds
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          jobs = [
              (
                  Path("AMDEV/TOOLS/CANVAEDIT/projects/pyrion_desing/assets/pyrion_background.jpg"),
                  Path("PYRION/pyrion_background.webp"),
              ),
              (
                  Path("AMDEV/TOOLS/CANVAEDIT/projects/project_orbit/assets/orbit_background.jpg"),
                  Path("PYRION/orbit_background.webp"),
              ),
          ]

          for src, dst in jobs:
              dst.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(src) as im:
                  im.save(dst, "WEBP", quality=90, method=6)
          PY
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PYRION/pyrion_background.webp PYRION/orbit_background.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add PYRION WebP backgrounds"
          git push
