name: Publicar catalogo maestro GENTOOLS

on:
  push:
    paths:
      - ".github/workflows/publicar_gentools_maestro.yml"
      - "PTM/gentools/generar_maestro.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maestro:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar maestro.csv
        run: python PTM/gentools/generar_maestro.py
      - name: Validar datos del maestro
        run: |
          python - <<'PY'
          import csv, hashlib, pathlib, unicodedata
          p = pathlib.Path("PTM/gentools/maestro.csv")
          expected_sha = "53a7df1ff3e238ae52717eb4509c17fc66e7ae920f798f6e4baae9a0b563f63c"
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == expected_sha, f"SHA256 inesperado: {digest}"
          with p.open("r", encoding="utf-8-sig", newline="") as fh:
              reader = csv.DictReader(fh, delimiter=";")
              assert len(reader.fieldnames) == 20, reader.fieldnames
              count = 0
              categories = set()
              titles = set()
              for row in reader:
                  count += 1
                  assert str(count) == row["id"], f"ID inesperado en fila {count}"
                  categories.add(row["categoria"])
                  title = unicodedata.normalize("NFKC", row["titulo"]).casefold().strip()
                  assert title not in titles, f"Titulo duplicado: {title}"
                  titles.add(title)
              assert count == 29200, count
              assert len(categories) == 119, len(categories)
          print(f"Validado: {count} ideas, {len(categories)} areas, {p.stat().st_size} bytes")
          PY
      - name: Publicar maestro en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PTM/gentools/maestro.csv
          if git diff --cached --quiet; then
            echo "maestro.csv sin cambios"
            exit 0
          fi
          git commit -m "PTM: publish GENTOOLS master catalog with 29200 ideas"
          git push
