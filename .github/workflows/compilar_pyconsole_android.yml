name: Compilar APK PyConsole
on:
  push:
    branches: [feature/android-pyconsole]
    paths:
      - 'AMDEV/TOOLS/PYCONSOLE_ANDROID/**'
      - '.github/workflows/compilar_pyconsole_android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extraer codigo Android
        run: tar -xJf project.tar.xz
        working-directory: AMDEV/TOOLS/PYCONSOLE_ANDROID
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: AMDEV/TOOLS/PYCONSOLE_ANDROID
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AMDEV-PyConsole-APK
          path: AMDEV/TOOLS/PYCONSOLE_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
