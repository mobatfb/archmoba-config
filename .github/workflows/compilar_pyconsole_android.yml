name: Compilar APK PyConsole
on:
  push:
    branches: [feature/android-pyconsole]
    paths:
      - 'AMDEV/TOOLS/PYCONSOLE_ANDROID/**'
      - '.github/workflows/compilar_pyconsole_android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract source
        run: tar -xJf project.tar.xz
        working-directory: AMDEV/TOOLS/PYCONSOLE_ANDROID
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: AMDEV/TOOLS/PYCONSOLE_ANDROID
      - uses: actions/upload-artifact@v4
        with:
          name: AMDEV-PyConsole-APK
          path: AMDEV/TOOLS/PYCONSOLE_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
