<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PYRION 3D - Refresh r1.4.0</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0c101d; }
    body { position: relative; font-family: system-ui, Arial, sans-serif; color: #dce4fa; }
    /* Los controles Refresh pertenecen a la columna izquierda, no al ancho superior. */
    header { position: absolute; z-index: 2; left: 0; bottom: 0; width: clamp(250px,25vw,330px);
      padding: 10px 14px; background: #171d30; border-top: 1px solid #36405b;
      border-right: 1px solid #36405b; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    button { padding: 9px 20px; color: #fff; background: #365b94; border: 0; border-radius: 6px; cursor: pointer; font-weight: 700; }
    button:hover { background: #4971af; }
    button:disabled { opacity: .6; cursor: wait; }
    #estado { flex: 1; min-width: 100%; font-size: 11px; color: #aebfe6;
      overflow-wrap: anywhere; }
    #estado[data-type="ready"] { color: #8edac0; }
    #estado[data-type="error"] { color: #ffaaa9; }
    #version { font-size: 12px; color: #d3b7ff; white-space: nowrap; }
    #wrapper-version { font-size: 10px; color: #8e9bb9; white-space: nowrap; }
    iframe { display: block; position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: #0c101d; }
    @media(max-width:640px) {
      header { width: 100%; padding: 7px 10px; }
      #estado { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <button id="refresh" type="button">Refresh</button>
    <span id="estado" data-type="loading" role="status" aria-live="polite">Conectando...</span>
    <span id="version">Visor: —</span>
    <span id="wrapper-version">Refresh r1.4.0</span>
  </header>
  <iframe id="contenido" title="Visualizador 3D PYRION" sandbox="allow-scripts"></iframe>

  <script>
    (() => {
      'use strict';
      const archivo = 'PYRION/engine3d/visor3d/index.html';
      const repo = 'mobatfb/archmoba-dev';
      const raw = 'https://raw.githubusercontent.com/' + repo + '/main/' + archivo;
      const api = 'https://api.github.com/repos/' + repo + '/contents/' + archivo + '?ref=main';
      const boton = document.getElementById('refresh');
      const visor = document.getElementById('contenido');
      const estado = document.getElementById('estado');
      const version = document.getElementById('version');
      const mismoServidor = /^https?:$/.test(location.protocol)
        && location.pathname.endsWith('/PYRION/engine3d/visor3d/refresh.html')
        && !/^(raw\.githubusercontent\.com|github\.com)$/.test(location.hostname);
      let fetching = false;
      let refreshId = 0;
      const storageKey = 'pyrion3d.selectedModel.' + repo;
      const mirrorStorageKey = 'pyrion3d.mirrorX.' + repo;
      const wireStorageKey = 'pyrion3d.showWire.' + repo;
      const materialStorageKey = 'pyrion3d.withMaterial.' + repo;
      const surfaceStorageKey = 'pyrion3d.showSurface.' + repo;
      let lastModel = null;
      let lastMirrorEnabled = false;
      let lastWireEnabled = true;
      let lastMaterialEnabled = false;
      let lastSurfaceEnabled = false;
      try {
        lastModel = localStorage.getItem(storageKey);
        lastMirrorEnabled = localStorage.getItem(mirrorStorageKey) === '1';
        const wireStored=localStorage.getItem(wireStorageKey);
        lastWireEnabled=wireStored===null ? true : wireStored==='1';
        lastMaterialEnabled=localStorage.getItem(materialStorageKey)==='1';
        lastSurfaceEnabled=localStorage.getItem(surfaceStorageKey)==='1';
      } catch (_) {}
      function saveModel(id) {
        lastModel = id;
        try { localStorage.setItem(storageKey, id); } catch (_) {}
      }
      function saveMirror(enabled) {
        lastMirrorEnabled = enabled;
        try { localStorage.setItem(mirrorStorageKey, enabled ? '1' : '0'); } catch (_) {}
      }

      function saveViewerOption(option, enabled) {
        const keys={wire:wireStorageKey,material:materialStorageKey,surface:surfaceStorageKey};
        if (!Object.prototype.hasOwnProperty.call(keys,option)) return;
        if (option==='wire') lastWireEnabled=enabled;
        if (option==='material') lastMaterialEnabled=enabled;
        if (option==='surface') lastSurfaceEnabled=enabled;
        try {localStorage.setItem(keys[option],enabled ? '1':'0');} catch (_) {}
      }

      function show(message, type='loading') {
        estado.textContent = message;
        estado.dataset.type = type;
      }
      function htmlVersion(html) {
        return html.match(/id="visor-version">([^<]+)</)?.[1] || 'desconocida';
      }
      // Los mensajes proceden del propio index.html ejecutado dentro del iframe.
      window.addEventListener('message', (event) => {
        if (event.source !== visor.contentWindow) return;
        const data = event.data;
        if (!data || data.source !== 'pyrion3d') return;
        if (data.type === 'request-model') {
          event.source.postMessage({
            source:'pyrion3d-host',type:'stored-model',id:lastModel,
            mirrorEnabled:lastMirrorEnabled,
            wireEnabled:lastWireEnabled,materialEnabled:lastMaterialEnabled,
            surfaceEnabled:lastSurfaceEnabled
          }, '*');
          return;
        }
        if (data.type === 'selected-model') {
          if (typeof data.id === 'string' && /^[A-Za-z0-9_-]{1,80}$/.test(data.id)) saveModel(data.id);
          return;
        }
        if (data.type === 'mirror-changed') {
          if (typeof data.enabled === 'boolean') saveMirror(data.enabled);
          return;
        }
        if (data.type === 'viewer-option-changed') {
          if (['wire','material','surface'].includes(data.option) &&
              typeof data.enabled === 'boolean') saveViewerOption(data.option, data.enabled);
          return;
        }
        if (!['html','loading','ready','error'].includes(data.type)) return;
        if (typeof data.version === 'string' && data.version.length < 30) {
          version.textContent = 'Visor: ' + data.version;
        }
        const detail = typeof data.detail === 'string' ? data.detail.slice(0, 240) : '';
        if (data.type === 'ready') show('Actualizado: ' + detail, 'ready');
        else if (data.type === 'error') show('Error del visor: ' + detail, 'error');
        else if (data.type === 'loading') show(detail);
        else show('HTML cargado; solicitando modelos...');
      });

      async function obtener(url) {
        const control = new AbortController();
        const limite = setTimeout(() => control.abort(), 6000);
        try {
          const respuesta = await fetch(url, {cache:'no-store', mode:'cors', signal:control.signal});
          if (!respuesta.ok) throw Error('HTTP ' + respuesta.status);
          return respuesta;
        } finally {
          clearTimeout(limite);
        }
      }

      async function refrescar() {
        if (fetching) return;
        fetching = true;
        const current = ++refreshId;
        boton.disabled = true;
        boton.textContent = 'Cargando...';
        show('Consultando index.html en GitHub...');
        const nonce = Date.now() + '-' + Math.random().toString(36).slice(2);
        try {
          if (mismoServidor) {
            // Si se aloja junto al visor, la carga directa es mas sencilla.
            show('Abriendo index.html actualizado...');
            visor.src = './index.html?refresh=' + nonce;
          } else {
            // Descarga la version nueva sin mezclar la geometria con este archivo.
            // API primero: evita que el CDN RAW devuelva una version antigua.
            let html, source = 'GitHub API';
            try {
              const datos = await (await obtener(api + '&_=' + nonce)).json();
              if (datos.encoding !== 'base64' || typeof datos.content !== 'string') {
                throw Error('La API no entrego el archivo HTML.');
              }
              const binario = atob(datos.content.replace(/\s/g, ''));
              html = new TextDecoder().decode(Uint8Array.from(binario, c => c.charCodeAt(0)));
            } catch (errorAPI) {
              show('API no disponible; probando GitHub RAW...');
              source = 'GitHub RAW';
              try {
                html = await (await obtener(raw + '?_=' + nonce)).text();
              } catch (errorRaw) {
                throw Error('GitHub API: ' + errorAPI.message + '; RAW: ' + errorRaw.message);
              }
            }
            if (current !== refreshId) return;
            version.textContent = 'Visor: ' + htmlVersion(html);
            show('HTML recibido desde ' + source + '; cargando modelos...');
            visor.srcdoc = html;
          }
        } catch (error) {
          show('No se pudo actualizar: ' + error.message, 'error');
        } finally {
          fetching = false;
          boton.disabled = false;
          boton.textContent = 'Refresh';
        }
      }

      boton.addEventListener('click', refrescar);
      refrescar();
    })();
  </script>
</body>
</html>
