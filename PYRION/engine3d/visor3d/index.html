<!doctype html>
<html lang="es">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PYRION 3D - Visor de modelos</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden}
    body{background:#0b0f1c;color:#f0eefa}
    main{display:grid;grid-template-columns:clamp(250px,25vw,330px) minmax(0,1fr);
      width:100%;height:100vh;height:100dvh;overflow:hidden}
    .sidebar{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 18px;
      display:flex;flex-direction:column;gap:18px;background:#171c2d;border-right:1px solid #35405b}
    .sidebar header{display:flex;flex-direction:column;gap:7px}
    /* Espacio para el control Refresh superpuesto solo en refresh.html. */
    .sidebar.hosted{padding-bottom:126px}
    .brand{font-size:20px;font-weight:800;letter-spacing:.04em}
    .brand small{color:#a9b5d3;font-size:11px;font-weight:500}
    .sidebar-version{color:#a9b5d3;font-size:12px}
    #visor-version{color:#d1baff;font-weight:700}
    #mesh-version{color:#f0cea3;font-size:12px;font-weight:650;overflow-wrap:anywhere}
    .section{padding-top:14px;border-top:1px solid #343d56}
    .section h2{margin:0 0 10px;font-size:11px;font-weight:800;letter-spacing:.12em;
      color:#a6b6d8;text-transform:uppercase}
    nav{display:flex;flex-direction:column;align-items:stretch;gap:7px}
    nav button,.secondary-button{background:#252c42;color:#dae1fa;border:1px solid #46516f;
      padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;font:inherit;font-size:13px}
    nav button[aria-pressed="true"]{background:#6147a1;border-color:#bc9cff;color:#fff}
    nav button:hover,.secondary-button:hover{border-color:#ab8ce4;background:#343954}
    nav button:focus-visible,.secondary-button:focus-visible,input:focus-visible{outline:2px solid #d8c5ff;outline-offset:2px}
    .control{display:flex;flex-direction:column;align-items:stretch;gap:11px}
    .zoom-heading{display:flex;align-items:center;justify-content:space-between;font-size:13px}
    #zoom{width:100%;accent-color:#ab8ce4}
    output{font-variant-numeric:tabular-nums;color:#d1baff}
    .mirror-option{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
    .mirror-option input{width:17px;height:17px;accent-color:#ab8ce4;cursor:pointer}
    .mirror-option input:disabled{cursor:not-allowed;opacity:.55}
    .mirror-option:has(input:disabled){opacity:.55;cursor:not-allowed}
    .help{margin:0 0 10px;font-size:12px;color:#b0bddb;line-height:1.6}
    #camera-angle,#rotation-angle{font-size:12px;color:#94e1ce;font-variant-numeric:tabular-nums}
    #camera-angle{margin:0 0 10px}
    .secondary-button{width:100%;text-align:center}
    #status{margin:0;min-height:2em;color:#adb6ce;font-size:12px;line-height:1.6;
      overflow-wrap:anywhere}
    .preview-panel{position:relative;min-width:0;min-height:0;background:#101424}
    #visor{display:block;width:100%;height:100%;min-width:0;min-height:0;
      touch-action:none;cursor:grab;outline:none}
    #visor.is-dragging{cursor:grabbing}
    @media(max-width:640px){
      main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,auto) minmax(0,1fr)}
      .sidebar{max-height:min(43vh,270px);padding:12px 16px;gap:10px;border-right:0;
        border-bottom:1px solid #35405b}
      .brand{font-size:16px}
      nav{flex-direction:row;flex-wrap:wrap}
      nav button{padding:8px 10px}
      .section{padding-top:10px}
    }
  </style>
</head>
<body>
<main>
  <aside class="sidebar" aria-label="Información y controles de PYRION">
    <header>
      <div class="brand">PYRION <small>3D · MODELOS</small></div>
      <div class="sidebar-version">Versión del visor <span id="visor-version">v1.3.6</span></div>
      <div id="mesh-version" aria-live="polite">Modelo: —</div>
      <div id="rotation-angle">Giro 0°</div>
    </header>
    <section class="section">
      <h2>Modelos</h2>
      <nav id="modelos" aria-label="Seleccionar modelo 3D"></nav>
    </section>
    <section class="section">
      <h2>Visualización</h2>
      <div class="control">
        <div class="zoom-heading"><label for="zoom">Zoom</label><output id="valor" for="zoom">100%</output></div>
        <input id="zoom" type="range" min="50" max="220" value="100">
        <label class="mirror-option" for="mirror-x" title="Reflejar la mitad del modelo sobre el eje X">
          <input id="mirror-x" type="checkbox" autocomplete="off">
          Espejo X
        </label>
        <label class="mirror-option" for="show-wire" title="Mostrar las aristas de todos los triángulos">
          <input id="show-wire" type="checkbox" autocomplete="off">
          Ver malla
        </label>
        <label class="mirror-option" for="with-material" title="Activar los colores y el material original">
          <input id="with-material" type="checkbox" autocomplete="off">
          Con material
        </label>
        <label class="mirror-option" for="show-surface" title="Mostrar las caras solidas de los triangulos">
          <input id="show-surface" type="checkbox" autocomplete="off">
          Ver superficie
        </label>
        <label class="mirror-option" for="auto-rotate" title="Activar o pausar el giro automatico del modelo">
          <input id="auto-rotate" type="checkbox" autocomplete="off" checked>
          Girar
        </label>
      </div>
    </section>
    <section class="section">
      <h2>Cámara</h2>
      <p class="help">Arrastra sobre el modelo con el mouse para girar la cámara.
        Utiliza la rueda para acercar o alejar.</p>
      <div id="camera-angle">Horizontal 0° · Vertical 13°</div>
      <button class="secondary-button" id="reset-camera" type="button">Restablecer cámara</button>
    </section>
    <section class="section" aria-label="Estado de carga">
      <h2>Estado</h2>
      <p id="status" role="status" aria-live="polite">Cargando lista de modelos desde GitHub…</p>
    </section>
  </aside>
  <section class="preview-panel" aria-label="Vista 3D">
    <canvas id="visor" aria-label="Vista 3D: arrastra para girar la cámara sobre el modelo"></canvas>
  </section>
</main>
<script>
(() => {
  'use strict';
  const APP_VERSION = 'v1.3.6';
  const REPO = 'mobatfb/archmoba-dev';
  const MODELS_PATH = 'PYRION/engine3d/visor3d/models.json';
  const RAW = 'https://raw.githubusercontent.com/' + REPO + '/main/';
  const API = 'https://api.github.com/repos/' + REPO + '/contents/';
  const canvas = document.querySelector('#visor');
  const ctx = canvas.getContext('2d');
  const nav = document.querySelector('#modelos');
  const status = document.querySelector('#status');
  const slider = document.querySelector('#zoom');
  const value = document.querySelector('#valor');
  const mirrorCheck = document.querySelector('#mirror-x');
  const wireCheck = document.querySelector('#show-wire');
  const materialCheck = document.querySelector('#with-material');
  const surfaceCheck = document.querySelector('#show-surface');
  const rotateCheck = document.querySelector('#auto-rotate');
  if (window.parent !== window) {
    document.querySelector('.sidebar').classList.add('hosted');
  }
  // Comunica la carga al contenedor refresh.html si existe.
  function report(type, detail) {
    if (window.parent !== window) {
      window.parent.postMessage({source:'pyrion3d', type, version:APP_VERSION, detail}, '*');
    }
  }
  report('html', 'HTML cargado');
  let active = null;
  let serial = 0;
  let zoom = 1, width = 1, height = 1;
  let yaw = 0.55; // Giro automático del modelo, independiente de la cámara.
  let cameraYaw = 0, cameraPitch = 0.22; // Órbita controlada con el mouse.
  const cameraAngle = document.getElementById('camera-angle');
  const resetCamera = document.getElementById('reset-camera');
  const ROTATION_SPEED = Math.PI / 6; // 30 grados por segundo (vuelta cada 12 s).
  const rotationAngle = document.getElementById('rotation-angle');
  const meshVersionLabel = document.getElementById('mesh-version');
  const STORAGE_KEY = 'pyrion3d.selectedModel.' + REPO;
  const MIRROR_KEY = 'pyrion3d.mirrorX.' + REPO;
  const WIRE_KEY = 'pyrion3d.showWire.' + REPO;
  const MATERIAL_KEY = 'pyrion3d.withMaterial.' + REPO;
  const SURFACE_KEY = 'pyrion3d.showSurface.' + REPO;
  const ROTATE_KEY = 'pyrion3d.autoRotate.' + REPO;
  const ZOOM_KEY = 'pyrion3d.zoom.' + REPO;
  function validZoom(v) {
    const n=Number(v);
    return Number.isFinite(n) && n>=50 && n<=220 && Number.isInteger(n);
  }
  function applyZoom(value) {
    if (!validZoom(value)) return;
    slider.value=String(value);
    zoom=Number(value)/100;
    document.querySelector('#valor').textContent=String(value)+'%';
  }
  let mirrorEnabled = false;
  let wireEnabled = true;
  let materialEnabled = false;
  let surfaceEnabled = false;
  let rotateEnabled = true;
  // Estado completo persistido además de las claves individuales.
  const PREFS_KEY = 'pyrion3d.viewerPreferences.' + REPO;
  function viewerPreferences() {
    return {mirror:mirrorEnabled,wire:wireEnabled,material:materialEnabled,
      surface:surfaceEnabled,rotate:rotateEnabled,zoom:Number(slider.value)};
  }
  function storePreferences() {
    const prefs=viewerPreferences();
    try {
      window.localStorage.setItem(PREFS_KEY,JSON.stringify(prefs));
      window.localStorage.setItem(MIRROR_KEY,prefs.mirror?'1':'0');
      window.localStorage.setItem(WIRE_KEY,prefs.wire?'1':'0');
      window.localStorage.setItem(MATERIAL_KEY,prefs.material?'1':'0');
      window.localStorage.setItem(SURFACE_KEY,prefs.surface?'1':'0');
      window.localStorage.setItem(ROTATE_KEY,prefs.rotate?'1':'0');
      window.localStorage.setItem(ZOOM_KEY,String(prefs.zoom));
    } catch (_) {}
    if (window.parent !== window) {
      window.parent.postMessage({source:'pyrion3d',type:'preferences-changed',preferences:prefs},'*');
    }
  }
  const MESH_POLL_INTERVAL = 1500;
  let selectedModel = null;
  let meshSha = null;
  let meshSnapshot = null;
  let polling = false;
  let pollNotBefore = 0;
  const FRAME_INTERVAL = 1000 / 30; // Hasta 30 FPS en el renderizador Canvas 2D.

  function validPath(path) {
    return typeof path === 'string' &&
      path.startsWith('PYRION/engine3d/') &&
      !path.includes('..') && !path.includes('\\') &&
      /^[A-Za-z0-9_./-]+$/.test(path);
  }

  async function fetchJson(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 9000);
    try {
      const response = await fetch(url, {mode:'cors',cache:'no-store',headers:{'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'},signal:controller.signal});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return await response.json();
    } finally {clearTimeout(timer);}
  }

  // Refresca el catalogo desde la API antes de consultar el CDN RAW,
  // porque los nombres de models.json pueden permanecer en cache.
  async function apiJson(path, nonce) {
    const response = await fetchJson(API + path + '?ref=main&_=' + nonce);
    if (response.encoding !== 'base64' || typeof response.content !== 'string') {
      throw new Error('GitHub API no entregó un archivo Base64');
    }
    const binary = atob(response.content.replace(/\s+/g, ''));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  async function repoJson(path) {
    if (!validPath(path)) throw new Error('Ruta de archivo no permitida: ' + path);
    const nonce = Date.now() + '_' + Math.random().toString(36).slice(2);
    const attempts = path === MODELS_PATH
      ? [
          ['GitHub API', () => apiJson(path, nonce)],
          ['GitHub RAW', () => fetchJson(RAW + path + '?_=' + nonce)]
        ]
      : [
          ['GitHub RAW', () => fetchJson(RAW + path + '?_=' + nonce)],
          ['GitHub API', () => apiJson(path, nonce)]
        ];
    const errors = [];
    for (const [source, load] of attempts) {
      try { return await load(); }
      catch (error) { errors.push(source + ': ' + error.message); }
    }
    throw new Error('No se pudo leer ' + path.split('/').pop() +
      ' desde GitHub (' + errors.join('; ') + ')');
  }

  let parentSelection = null;
  let resolveParentSelection = null;
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || !event.data ||
        event.data.source !== 'pyrion3d-host' ||
        event.data.type !== 'stored-model') return;
    parentSelection = typeof event.data.id === 'string' ? event.data.id : null;
    if (typeof event.data.mirrorEnabled === 'boolean') {
      // El contenedor conserva el estado para el iframe sandbox (sin localStorage).
      mirrorEnabled = event.data.mirrorEnabled;
      mirrorCheck.checked = mirrorEnabled;
      applyMirrorGeometry();
    }
    if (typeof event.data.wireEnabled === 'boolean') {
      wireEnabled = event.data.wireEnabled;
      wireCheck.checked = wireEnabled;
    }
    if (typeof event.data.materialEnabled === 'boolean') {
      materialEnabled = event.data.materialEnabled;
      materialCheck.checked = materialEnabled;
    }
    if (typeof event.data.surfaceEnabled === 'boolean') {
      surfaceEnabled = event.data.surfaceEnabled;
      surfaceCheck.checked = surfaceEnabled;
    }
    if (typeof event.data.rotateEnabled === 'boolean') {
      rotateEnabled=event.data.rotateEnabled;
      rotateCheck.checked=rotateEnabled;
    }
    if (validZoom(event.data.zoom)) applyZoom(event.data.zoom);
    // Tras restaurar desde el host, mantener el mismo snapshot en el iframe.
    try {window.localStorage.setItem(PREFS_KEY,JSON.stringify(viewerPreferences()));} catch (_) {}
    render();
    if (resolveParentSelection) {
      const finish = resolveParentSelection;
      resolveParentSelection = null;
      finish(parentSelection);
    }
  });

  function rememberModel(id) {
    try { window.localStorage.setItem(STORAGE_KEY, id); } catch (_) {}
    if (window.parent !== window) {
      window.parent.postMessage({source:'pyrion3d',type:'selected-model',id}, '*');
    }
  }

  function rememberedModel() {
    try { return window.localStorage.getItem(STORAGE_KEY); } catch (_) { return null; }
  }

  function rememberedMirror() {
    try { return window.localStorage.getItem(MIRROR_KEY) === '1'; }
    catch (_) { return false; }
  }

  function saveViewerOption(option, enabled) {
    const keys={wire:WIRE_KEY,material:MATERIAL_KEY,surface:SURFACE_KEY,rotate:ROTATE_KEY};
    if (!Object.prototype.hasOwnProperty.call(keys,option)) return;
    if (option === 'wire') {wireEnabled=!!enabled;wireCheck.checked=wireEnabled;}
    if (option === 'material') {materialEnabled=!!enabled;materialCheck.checked=materialEnabled;}
    if (option === 'surface') {surfaceEnabled=!!enabled;surfaceCheck.checked=surfaceEnabled;}
    if (option === 'rotate') {rotateEnabled=!!enabled;rotateCheck.checked=rotateEnabled;}
    storePreferences();
    render();
  }

  function saveMirror(enabled) {
    mirrorEnabled = !!enabled;
    mirrorCheck.checked = mirrorEnabled;
    storePreferences();
    applyMirrorGeometry();
  }

  function restoreModel() {
    const local = rememberedModel();
    if (window.parent === window) return Promise.resolve(local);
    // El iframe sandbox de refresh.html tiene origen opaco y no puede leer
    // localStorage. Se consulta al contenedor para restaurar su selección.
    return new Promise(resolve => {
      const timer = setTimeout(() => {
        if (resolveParentSelection === finish) resolveParentSelection = null;
        resolve(parentSelection || local);
      }, 1200);
      function finish(id) {
        clearTimeout(timer);
        resolve(id || local);
      }
      resolveParentSelection = finish;
      window.parent.postMessage({source:'pyrion3d',type:'request-model'}, '*');
    });
  }

  // GitHub Contents proporciona el SHA de contenido y la malla en una petición.
  // Sólo se decodifica y valida cuando el SHA cambia.
  async function meshFromApi(path) {
    const response = await fetchJson(API + path + '?ref=main&_=' + Date.now() + '-' + Math.random().toString(36).slice(2));
    if (!response || typeof response.sha !== 'string' ||
        response.encoding !== 'base64' || typeof response.content !== 'string') {
      throw new Error('Respuesta de malla inválida desde GitHub');
    }
    return response;
  }

  function decodeMeshResponse(response) {
    const binary = atob(response.content.replace(/\s+/g, ''));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(binary, c => c.charCodeAt(0))));
  }

  function meshVersion(source) {
    // Un unico atributo version en cada .mesh: version del modelo, no del formato.
    if (!source || typeof source.version !== 'string' ||
        !/^\d+\.\d+\.\d+$/.test(source.version)) {
      throw new Error('El archivo .mesh debe tener "version": "1.0.0" (formato X.Y.Z)');
    }
    return source.version;
  }

  function compareMeshVersions(next, current) {
    const a=next.split('.').map(Number),b=current.split('.').map(Number);
    for (let i=0;i<3;i++) if (a[i]!==b[i]) return a[i]>b[i]?1:-1;
    return 0;
  }

  function showMeshVersion(model, version) {
    meshVersionLabel.textContent = model.name + ' · v' + version;
  }

  // El espejo es una copia virtual: el archivo .mesh original no cambia.
  // Sólo las mallas modeladas como una mitad (con borde en X=0) admiten espejo.
  function canMirrorGeometry(geometry) {
    if (!geometry || !geometry.vertices || !geometry.faces ||
        geometry.vertices.length * 2 > 12000 || geometry.faces.length * 2 > 20000) return false;
    let left = false, right = false, seam = false;
    for (const v of geometry.vertices) {
      if (v[0] < -1e-5) left = true;
      else if (v[0] > 1e-5) right = true;
      else seam = true;
      if (left && right) return false;
    }
    return seam && (left || right);
  }

  function createMirroredGeometry(base) {
    const vertices = base.vertices.map(v => v.slice());
    const mirrorIndices = base.vertices.map((v, i) => {
      if (Math.abs(v[0]) <= 1e-5) return i; // Vértice compartido sobre la costura.
      const mirrored = vertices.length;
      vertices.push([-v[0],v[1],v[2]]);
      return mirrored;
    });
    const faces = base.faces.map(f => f.slice());
    const faceColors = base.faceColors ? base.faceColors.slice() : null;
    for (let faceIndex = 0; faceIndex < base.faces.length; faceIndex++) {
      const f = base.faces[faceIndex];
      if (f.every(i => Math.abs(base.vertices[i][0]) <= 1e-5)) continue;
      // La reflexión invierte la orientación y conserva el color original.
      faces.push([mirrorIndices[f[0]],mirrorIndices[f[2]],mirrorIndices[f[1]]]);
      if (faceColors) faceColors.push(base.faceColors[faceIndex]);
    }
    return {vertices,faces,faceColors};
  }

  function applyMirrorGeometry() {
    if (!active) {
      mirrorCheck.disabled = true;
      return;
    }
    const compatible = canMirrorGeometry(active.baseGeometry);
    mirrorCheck.disabled = !compatible;
    mirrorCheck.title = compatible
      ? 'Reflejar la mitad del modelo sobre el eje X'
      : 'El espejo se habilita únicamente para modelos construidos por mitades';
    active.geometry = mirrorEnabled && compatible
      ? createMirroredGeometry(active.baseGeometry)
      : active.baseGeometry;
    render();
  }

  async function pollSelectedMesh() {
    if (polling || !selectedModel || !active || Date.now() < pollNotBefore) return;
    const model = selectedModel, request = serial;
    polling = true;
    try {
      const response = await meshFromApi(model.mesh);
      if (request !== serial || selectedModel !== model || !active) return;
      if (response.sha === meshSha) return;
      const source = decodeMeshResponse(response);
      const snapshot = JSON.stringify(source);
      if (snapshot === meshSnapshot) {
        meshSha = response.sha;
        return;
      }
      const nextVersion = meshVersion(source);
      const geometry = checkMesh(source, model.scale);
      if (request !== serial || selectedModel !== model || !active) return;
      const versionIncreased = compareMeshVersions(nextVersion, active.meshVersion) > 0;
      // Sólo intercambiamos geometría y versión. El giro y la cámara permanecen intactos.
      active.baseGeometry = geometry;
      active.meshVersion = nextVersion;
      applyMirrorGeometry();
      meshSha = response.sha;
      meshSnapshot = snapshot;
      showMeshVersion(model, nextVersion);
      if (!versionIncreased) {
        const warning = 'El archivo .mesh cambió sin incrementar su versión (' + nextVersion + ')';
        console.warn('[PYRION]', warning, model.mesh);
        status.textContent = model.name + ' · ' + warning;
        report('ready', model.name + ' · ' + warning);
      } else {
        status.textContent = model.name + ' · v' + nextVersion + ' · ' +
          active.geometry.vertices.length + ' vértices · ' + active.geometry.faces.length +
          ' triángulos · Malla actualizada';
        report('ready', 'Malla ' + model.name + ' · v' + nextVersion + ' actualizada en vivo');
      }
    } catch (error) {
      // Ante límites de API o desconexión, el visor sigue girando.
      if (/HTTP (403|429)/.test(error.message)) pollNotBefore = Date.now() + 60000;
    } finally {
      polling = false;
    }
  }

  function sphereGeometry(params) {
    // Los vértices se generan al cargar sphere.mesh, igual que en PYRION Engine.
    const rings = Number(params?.rings), segments = Number(params?.segments), radius = Number(params?.radius);
    if (!Number.isInteger(rings) || !Number.isInteger(segments) ||
        rings < 4 || rings > 128 || segments < 6 || segments > 256 ||
        !Number.isFinite(radius) || radius <= 0) {
      throw new Error('Parámetros de esfera no válidos');
    }
    const vertices = [[0,radius,0]], faces = [];
    for (let i=1;i<rings;i++) {
      const theta = Math.PI*i/rings, h=radius*Math.cos(theta), r=radius*Math.sin(theta);
      for (let j=0;j<segments;j++) {
        const lon=2*Math.PI*j/segments;
        vertices.push([r*Math.cos(lon),h,r*Math.sin(lon)]);
      }
    }
    const south=vertices.length;
    vertices.push([0,-radius,0]);
    for (let j=0;j<segments;j++) {
      const next=(j+1)%segments;
      faces.push([0,1+j,1+next]);
    }
    for (let i=1;i<rings-1;i++) for (let j=0;j<segments;j++) {
      const next=(j+1)%segments;
      const a=1+(i-1)*segments+j, b=1+(i-1)*segments+next;
      const c=1+i*segments+j, d=1+i*segments+next;
      faces.push([a,c,d],[a,d,b]);
    }
    for (let j=0;j<segments;j++) {
      const next=(j+1)%segments;
      faces.push([1+(rings-2)*segments+j,south,1+(rings-2)*segments+next]);
    }
    // PYRION usa estas caras para renderizado interno; aquí orientamos las
    // normales hacia fuera para que el visor dibuje sus caras externas.
    for (const f of faces) {
      const a=vertices[f[0]],b=vertices[f[1]],c=vertices[f[2]];
      const ab=[b[0]-a[0],b[1]-a[1],b[2]-a[2]];
      const ac=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
      const n=cross(ab,ac);
      const center=[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3,(a[2]+b[2]+c[2])/3];
      if (dot(n,center) < 0) [f[1],f[2]]=[f[2],f[1]];
    }
    return {vertices,faces};
  }

  function checkMesh(source, scale) {
    if (!source || source.format!=='pyrion.mesh') throw new Error('Formato .mesh no válido');
    let geometry;
    if (source.primitive==='triangle_mesh') {
      geometry = {vertices:source.vertices,faces:source.faces};
    } else if (source.primitive==='uv_sphere') {
      geometry = sphereGeometry(source.parameters);
    } else throw new Error('Tipo de malla no compatible: ' + source.primitive);
    if (!Array.isArray(geometry.vertices) || !Array.isArray(geometry.faces) ||
        geometry.vertices.length<3 || geometry.vertices.length>12000 ||
        geometry.faces.length<1 || geometry.faces.length>20000 ||
        geometry.vertices.some(v=>!Array.isArray(v) || v.length!==3 || v.some(n=>!Number.isFinite(n))) ||
        geometry.faces.some(f=>!Array.isArray(f) || f.length!==3 || f.some(i=>!Number.isInteger(i)||i<0||i>=geometry.vertices.length))) {
      throw new Error('La malla contiene vértices o triángulos inválidos');
    }
    const rawColors = source.face_colors;
    if (rawColors !== undefined && (!Array.isArray(rawColors) ||
        rawColors.length !== geometry.faces.length ||
        rawColors.some(c => c !== null && (typeof c !== 'string' ||
          !/^#[0-9a-fA-F]{6}$/.test(c))))) {
      throw new Error('face_colors debe tener un color #RRGGBB o null por triangulo');
    }
    const faceColors = rawColors === undefined ? null : rawColors.map(c =>
      c === null ? null : [1,3,5].map(i => parseInt(c.slice(i,i+2),16)));
    const factors=Array.isArray(scale) && scale.length===3 &&
      scale.every(v=>Number.isFinite(v)&&v>0) ? scale : [1,1,1];
    return {
      vertices:geometry.vertices.map(v=>v.map((n,i)=>n*factors[i])),
      faces:geometry.faces,
      faceColors
    };
  }

  function sub(a,b) {return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
  function dot(a,b) {return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
  function cross(a,b) {return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
  function unit(a) {const r=Math.hypot(...a)||1;return a.map(n=>n/r);}
  const light=unit([-.45,.72,1]),light2=unit([.8,-.18,.65]);

  function render() {
    ctx.clearRect(0,0,width,height);
    const background=ctx.createRadialGradient(width/2,height/2,3,width/2,height/2,Math.max(width,height)*.62);
    background.addColorStop(0,'#29213e');background.addColorStop(1,'#101424');
    ctx.fillStyle=background;ctx.fillRect(0,0,width,height);
    if (!active) return;
    const vs=active.geometry.vertices, fs=active.geometry.faces;
    const cy=Math.cos(yaw),sy=Math.sin(yaw);
    const cc=Math.cos(cameraYaw),sc=Math.sin(cameraYaw);
    const cp=Math.cos(cameraPitch),sp=Math.sin(cameraPitch);
    const bounds=[0,1,2].map(i=>[Math.min(...vs.map(v=>v[i])),Math.max(...vs.map(v=>v[i]))]);
    const center=bounds.map(b=>(b[0]+b[1])/2);
    const points=vs.map(v=>{
      const x=v[0]-center[0],y=v[1]-center[1],z=v[2]-center[2];
      const rx=x*cy+z*sy,rz=-x*sy+z*cy;
      const viewX=rx*cc-rz*sc,viewZ=rx*sc+rz*cc;
      return [viewX,y*cp-viewZ*sp,y*sp+viewZ*cp];
    });
    // Escala constante durante la rotacion: evita que el modelo pulse
    // o cambie de tamaño al girar sobre el eje vertical.
    const xSpan=bounds[0][1]-bounds[0][0];
    const ySpan=bounds[1][1]-bounds[1][0];
    const zSpan=bounds[2][1]-bounds[2][0];
    const diameter=Math.hypot(xSpan,zSpan);
    // Escala fija ante giro del modelo Y movimiento de cámara (no "respira").
    const scale=Math.min(width*.78/Math.max(.1,diameter),
                         height*.76/Math.max(.1,Math.hypot(xSpan,ySpan,zSpan))) * zoom;
    const screen=points.map(p=>{const k=4.8/(4.8-p[2]);return [width/2+p[0]*scale*k,height/2-p[1]*scale*k];});
    // Sin superficie: solo las aristas de la malla; sin relleno ni piel gris.
    if (!surfaceEnabled) {
      if (wireEnabled) {
        ctx.lineJoin='round';
        ctx.lineWidth=.85;
        ctx.strokeStyle='rgba(205,215,233,.9)';
        ctx.beginPath();
        const edges=new Set();
        for (const [i,j,k] of fs) {
          for (const [u,v] of [[i,j],[j,k],[k,i]]) {
            const key=Math.min(u,v)+':'+Math.max(u,v);
            if (edges.has(key)) continue;
            edges.add(key);
            ctx.moveTo(...screen[u]);
            ctx.lineTo(...screen[v]);
          }
        }
        ctx.stroke();
      }
      return;
    }
    const metal=active.metallic, rough=active.roughness;
    const faceColors=active.geometry.faceColors;
    const triangles=[];
    for (let index=0;index<fs.length;index++) {
      const f=fs[index];
      const a=points[f[0]],b=points[f[1]],c=points[f[2]];
      // Renderizado de doble cara: invertir la normal solo para iluminar la
      // cara posterior. No se agrega ni se duplica ningun triangulo al mesh.
      const normal=unit(cross(sub(b,a),sub(c,a)));
      const facing=normal[2]<0 ? normal.map(n=>-n) : normal;
      const brightness=.33+.71*Math.max(0,dot(facing,light))+.20*Math.max(0,dot(facing,light2));
      const shine=Math.pow(Math.max(0,dot(facing,unit([.1,.62,1]))),9+43*(1-rough))*(metal>.5?100:70);
      const col=materialEnabled ? (faceColors?.[index] || active.color) : [176,185,201];
      const color=col.map(v=>Math.min(255,Math.round(v*brightness+shine*(.6+metal*.4))));
      triangles.push({f,depth:(a[2]+b[2]+c[2])/3,fill:'rgb('+color.join(',')+')'});
    }
    // Z-buffer real: evita que caras interiores o del piso atraviesen otras
    // por ordenar triangulos segun su profundidad PROMEDIO.
    const rw=Math.max(1,Math.round(width)),rh=Math.max(1,Math.round(height));
    const image=ctx.createImageData(rw,rh);
    const pixels=image.data;
    const depthBuffer=new Float32Array(rw*rh);
    depthBuffer.fill(-Infinity);
    const edgeBuffer=wireEnabled ? new Uint8Array(rw*rh) : null;
    for (const t of triangles) {
      const f=t.f;
      const a=screen[f[0]],b=screen[f[1]],c=screen[f[2]];
      const area=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
      if (Math.abs(area)<1e-8) continue;
      const x0=Math.max(0,Math.floor(Math.min(a[0],b[0],c[0])));
      const x1=Math.min(rw-1,Math.ceil(Math.max(a[0],b[0],c[0])));
      const y0=Math.max(0,Math.floor(Math.min(a[1],b[1],c[1])));
      const y1=Math.min(rh-1,Math.ceil(Math.max(a[1],b[1],c[1])));
      const invArea=1/area;
      const za=1/(4.8-points[f[0]][2]),zb=1/(4.8-points[f[1]][2]),zc=1/(4.8-points[f[2]][2]);
      const rgb=t.fill.match(/\d+/g).map(Number);
      for(let y=y0;y<=y1;y++){
        for(let x=x0;x<=x1;x++){
          const px=x+.5,py=y+.5;
          const u=((b[0]-px)*(c[1]-py)-(b[1]-py)*(c[0]-px))*invArea;
          const v=((c[0]-px)*(a[1]-py)-(c[1]-py)*(a[0]-px))*invArea;
          const w=1-u-v;
          if(u < -1e-6 || v < -1e-6 || w < -1e-6)continue;
          const z=u*za+v*zb+w*zc;
          const pos=y*rw+x;
          if(z<=depthBuffer[pos])continue;
          depthBuffer[pos]=z;
          const off=pos*4;
          pixels[off]=rgb[0];pixels[off+1]=rgb[1];pixels[off+2]=rgb[2];pixels[off+3]=255;
          if(edgeBuffer)edgeBuffer[pos]=Math.min(u,v,w)<.012 ? 1:0;
        }
      }
    }
    if(edgeBuffer)for(let p=0;p<edgeBuffer.length;p++)if(edgeBuffer[p]){
      const off=p*4;pixels[off]=18;pixels[off+1]=24;pixels[off+2]=40;
    }
    // Composicion sobre el fondo sin rectangulo opaco.
    const layer=document.createElement('canvas');layer.width=rw;layer.height=rh;
    layer.getContext('2d').putImageData(image,0,0);
    ctx.drawImage(layer,0,0,width,height);
  }

  function resize() {
    const r=canvas.getBoundingClientRect();
    width=Math.max(1,r.width);height=Math.max(1,r.height);
    const d=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.round(width*d);canvas.height=Math.round(height*d);
    ctx.setTransform(d,0,0,d,0,0);
    render();
  }

  async function selectModel(model) {
    const request=++serial;
    for (const button of nav.querySelectorAll('button')) {
      button.setAttribute('aria-pressed',String(button.dataset.id===model.id));
    }
    selectedModel = model;
    meshVersionLabel.textContent = model.name + ' · cargando…';
    meshSha = null;
    meshSnapshot = null;
    active=null;
    mirrorCheck.disabled = true;
    render();
    status.textContent='Cargando '+model.name+' desde GitHub…';
    report('loading', 'Cargando malla de '+model.name+'...');
    try {
      const [loaded, material] = await Promise.all([
        meshFromApi(model.mesh).then(response => ({
          source: decodeMeshResponse(response), sha: response.sha
        })).catch(async () => ({source: await repoJson(model.mesh), sha: null})),
        model.material ? repoJson(model.material).catch(()=>null) : Promise.resolve(null)
      ]);
      const source = loaded.source;
      if (request!==serial) return;
      const loadedVersion = meshVersion(source);
      const geometry=checkMesh(source,model.scale);
      const colorText=material?.base_color || source.material?.base_color || '#8D55C2';
      const hex=/^#[0-9a-f]{6}$/i.test(colorText)?colorText:'#8D55C2';
      const color=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
      const metallic=Math.max(0,Math.min(1,Number(material?.metallic)||0));
      const roughness=Math.max(.04,Math.min(1,Number(material?.roughness)||.45));
      const edge=metallic>.6?'rgba(250,226,173,.22)':
                 (model.id==='dark_gem'?'rgba(183,192,214,.33)':'rgba(222,206,245,.28)');
      active={baseGeometry:geometry,geometry,color,metallic,roughness,edge,meshVersion:loadedVersion};
      applyMirrorGeometry();
      showMeshVersion(model, loadedVersion);
      meshSha = loaded.sha;
      meshSnapshot = JSON.stringify(source);
      rememberModel(model.id);
      status.textContent=model.name+' · v'+loadedVersion+' · '+active.geometry.vertices.length+' vértices · '+active.geometry.faces.length+' triángulos';
      render();
      report('ready', model.name+' · v'+loadedVersion+' · '+active.geometry.vertices.length+' vértices · '+active.geometry.faces.length+' triángulos');
    } catch (e) {
      if (request!==serial) return;
      status.textContent=e.message+' · Abre el HTML en un navegador con acceso a GitHub.';
      report('error', e.message);
    }
  }

  function buildMenu(models) {
    nav.replaceChildren();
    for (const model of models) {
      const button=document.createElement('button');
      button.type='button';button.textContent=model.name;
      button.dataset.id=model.id;
      button.setAttribute('aria-pressed','false');
      button.addEventListener('click',()=>selectModel(model));
      nav.appendChild(button);
    }
  }

  async function init() {
    try {
      report('loading', 'Consultando models.json...');
      const catalog=await repoJson(MODELS_PATH);
      if (!catalog || !Array.isArray(catalog.models) || !catalog.models.length) {
        throw new Error('models.json no tiene modelos registrados');
      }
      const models=catalog.models.filter(m=>m && typeof m.id==='string' &&
        typeof m.name==='string' && validPath(m.mesh) &&
        (!m.material || validPath(m.material)));
      if (!models.length) throw new Error('models.json no contiene rutas válidas');
      buildMenu(models);
      const previous = await restoreModel();
      await selectModel(models.find(m => m.id === previous) || models[0]);
    } catch (e) {
      status.textContent=e.message;
      report('error',e.message);
    }
  }

  try {
    const stored=window.localStorage.getItem(PREFS_KEY);
    const prefs=stored ? JSON.parse(stored) : null;
    if (prefs && typeof prefs==='object' &&
        ['mirror','wire','material','surface'].every(k=>typeof prefs[k]==='boolean')) {
      mirrorEnabled=prefs.mirror;
      wireEnabled=prefs.wire;
      materialEnabled=prefs.material;
      surfaceEnabled=prefs.surface;
      if (typeof prefs.rotate==='boolean') rotateEnabled=prefs.rotate;
      if (validZoom(prefs.zoom)) applyZoom(prefs.zoom);
    } else {
      const storedWire=window.localStorage.getItem(WIRE_KEY);
      wireEnabled=storedWire===null ? true : storedWire==='1';
      materialEnabled=window.localStorage.getItem(MATERIAL_KEY)==='1';
      surfaceEnabled=window.localStorage.getItem(SURFACE_KEY)==='1';
      const storedRotate=window.localStorage.getItem(ROTATE_KEY);
      rotateEnabled=storedRotate===null ? true : storedRotate==='1';
      mirrorEnabled=window.localStorage.getItem(MIRROR_KEY)==='1';
      applyZoom(window.localStorage.getItem(ZOOM_KEY));
    }
  } catch (_) {}
  wireCheck.checked=wireEnabled;
  materialCheck.checked=materialEnabled;
  surfaceCheck.checked=surfaceEnabled;
  rotateCheck.checked=rotateEnabled;
  wireCheck.addEventListener('change', () => saveViewerOption('wire',wireCheck.checked));
  materialCheck.addEventListener('change', () => saveViewerOption('material',materialCheck.checked));
  surfaceCheck.addEventListener('change', () => saveViewerOption('surface',surfaceCheck.checked));
  rotateCheck.addEventListener('change', () => saveViewerOption('rotate',rotateCheck.checked));
  mirrorCheck.checked = mirrorEnabled;
  mirrorCheck.disabled = true;
  mirrorCheck.addEventListener('change', () => {
    saveMirror(mirrorCheck.checked);
    if (active && selectedModel) {
      status.textContent = selectedModel.name + ' · v' + active.meshVersion + ' · ' +
        active.geometry.vertices.length + ' vértices · ' +
        active.geometry.faces.length + ' triángulos' +
        (mirrorEnabled && !mirrorCheck.disabled ? ' · Espejo X' : '');
    }
  });

  slider.addEventListener('input',()=>{
    zoom=Number(slider.value)/100;
    value.textContent=slider.value+'%';
    storePreferences();
    render();
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    slider.value=String(Math.min(220,Math.max(50,Number(slider.value)+(e.deltaY<0?10:-10))));
    slider.dispatchEvent(new Event('input'));
  },{passive:false});
  // La cámara es independiente del giro automático del objeto.
  function updateCameraLabel() {
    const horizontal=((cameraYaw*180/Math.PI)%360+360)%360;
    cameraAngle.textContent='Horizontal '+Math.round(horizontal)+
      '° · Vertical '+Math.round(cameraPitch*180/Math.PI)+'°';
  }
  let drag=null;
  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag={id:e.pointerId,x:e.clientX,y:e.clientY};
    canvas.classList.add('is-dragging');
    canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag || drag.id !== e.pointerId) return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    drag.x=e.clientX;drag.y=e.clientY;
    cameraYaw=(cameraYaw+dx*.007)%(2*Math.PI);
    cameraPitch=Math.max(-1.25,Math.min(1.25,cameraPitch+dy*.006));
    updateCameraLabel();
    render();
    e.preventDefault();
  });
  function finishCameraDrag(e) {
    if (!drag || drag.id !== e.pointerId) return;
    drag=null;
    canvas.classList.remove('is-dragging');
    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  }
  canvas.addEventListener('pointerup',finishCameraDrag);
  canvas.addEventListener('pointercancel',finishCameraDrag);
  canvas.addEventListener('lostpointercapture',finishCameraDrag);
  resetCamera.addEventListener('click', () => {
    cameraYaw=0;
    cameraPitch=.22;
    updateCameraLabel();
    render();
  });
  updateCameraLabel();

  if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
  else window.addEventListener('resize',resize);

  // Animacion propia del visor: recarga de modelos y zoom siguen funcionando.
  // Un solo bucle de animacion por pagina; no se crean bucles al cambiar modelo.
  let lastFrame=0;
  function animate(now) {
    if (!lastFrame) lastFrame=now;
    const elapsed=now-lastFrame;
    if (elapsed>=FRAME_INTERVAL) {
      lastFrame=now;
      if (active) {
        // requestAnimationFrame ya reduce la frecuencia si el visor no está visible.
        // No usar document.hidden: algunos visores integrados lo marcan oculto.
        if (rotateEnabled) yaw=(yaw+ROTATION_SPEED*Math.min(elapsed,100)/1000)%(2*Math.PI);
        rotationAngle.textContent='Giro '+Math.round(((yaw*180/Math.PI)%360+360)%360)+'°';
        render();
      }
    }
    requestAnimationFrame(animate);
  }
  resize();init();
  setInterval(pollSelectedMesh, MESH_POLL_INTERVAL);
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
