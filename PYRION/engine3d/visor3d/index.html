<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PYRION 3D - Visor de modelos</title>
  <style>
    :root {color-scheme:dark; font-family:system-ui,Arial,sans-serif}
    * {box-sizing:border-box}
    body {margin:0; background:#0b0f1c; color:#f0eefa; min-height:100vh; display:flex;justify-content:center}
    main {width:min(100%,900px); padding:18px}
    header {display:flex;align-items:center;flex-wrap:wrap;gap:12px; padding:12px 15px;
      background:#171c2d;border:1px solid #35405b;border-radius:12px 12px 0 0}
    .brand {font-size:13px;font-weight:750;letter-spacing:.04em;white-space:nowrap}
    .brand small {color:#a9b5d3;font-size:10px;font-weight:400}
    .build-info {margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap;color:#b9c4df;font-size:11px}
    #visor-version {font-weight:700;color:#d1baff}
    #rotation-angle {font-variant-numeric:tabular-nums;color:#94e1ce}
    nav {display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
    nav button {background:#252c42;color:#dae1fa;border:1px solid #46516f;
      padding:9px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px}
    nav button[aria-pressed="true"] {background:#6147a1;border-color:#bc9cff;color:white}
    nav button:focus-visible {outline:2px solid #d8c5ff;outline-offset:2px}
    #visor {display:block;width:100%;height:min(65vh,540px);min-height:280px;
      background:#13172a;border:1px solid #35405b;border-top:0;touch-action:pan-y}
    .control {display:flex;gap:12px;align-items:center;justify-content:center;
      padding:16px;background:#171c2d;border:1px solid #35405b;border-top:0;border-radius:0 0 12px 12px}
    #zoom {width:min(270px,55vw);accent-color:#ab8ce4}
    output {min-width:45px;text-align:right;font-variant-numeric:tabular-nums}
    #status {min-height:2em;color:#adb6ce;text-align:center;font-size:12px;line-height:1.6;margin:12px 0 0}
    @media(max-width:560px) {main{padding:8px}header{gap:9px;padding:10px}nav button{padding:8px 9px}#visor{height:400px}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">PYRION 3D <small>· MODELOS</small></div>
    <nav id="modelos" aria-label="Seleccionar modelo 3D"></nav>
    <div class="build-info" aria-label="Versión y rotación del visor"><span id="visor-version">v1.1.1</span><span id="rotation-angle">Giro 0°</span></div>
  </header>
  <canvas id="visor" aria-label="Visualización 3D con rotación automática de la malla seleccionada"></canvas>
  <div class="control">
    <label for="zoom">Zoom</label>
    <input id="zoom" type="range" min="50" max="220" value="100">
    <output id="valor" for="zoom">100%</output>
  </div>
  <p id="status" role="status" aria-live="polite">Cargando lista de modelos desde GitHub…</p>
</main>
<script>
(() => {
  'use strict';
  const APP_VERSION = 'v1.1.1';
  const REPO = 'mobatfb/archmoba-dev';
  const MODELS_PATH = 'PYRION/engine3d/visor3d/models.json';
  const RAW = 'https://raw.githubusercontent.com/' + REPO + '/main/';
  const API = 'https://api.github.com/repos/' + REPO + '/contents/';
  const canvas = document.querySelector('#visor');
  const ctx = canvas.getContext('2d');
  const nav = document.querySelector('#modelos');
  const status = document.querySelector('#status');
  const slider = document.querySelector('#zoom');
  const value = document.querySelector('#valor');
  // Comunica la carga al contenedor refresh.html si existe.
  function report(type, detail) {
    if (window.parent !== window) {
      window.parent.postMessage({source:'pyrion3d', type, version:APP_VERSION, detail}, '*');
    }
  }
  report('html', 'HTML cargado');
  let active = null;
  let serial = 0;
  let zoom = 1, width = 1, height = 1;
  let yaw = 0.55;
  const pitch = 0.22; // Inclinación fija: el modelo gira sobre su eje Y.
  const ROTATION_SPEED = Math.PI / 6; // 30 grados por segundo (vuelta cada 12 s).
  const rotationAngle = document.getElementById('rotation-angle');
  const FRAME_INTERVAL = 1000 / 30; // Hasta 30 FPS en el renderizador Canvas 2D.

  function validPath(path) {
    return typeof path === 'string' &&
      path.startsWith('PYRION/engine3d/') &&
      !path.includes('..') && !path.includes('\\') &&
      /^[A-Za-z0-9_./-]+$/.test(path);
  }

  async function fetchJson(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 9000);
    try {
      const response = await fetch(url, {mode:'cors',cache:'no-store',signal:controller.signal});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return await response.json();
    } finally {clearTimeout(timer);}
  }

  // Refresca el catalogo desde la API antes de consultar el CDN RAW,
  // porque los nombres de models.json pueden permanecer en cache.
  async function apiJson(path, nonce) {
    const response = await fetchJson(API + path + '?ref=main&_=' + nonce);
    if (response.encoding !== 'base64' || typeof response.content !== 'string') {
      throw new Error('GitHub API no entregó un archivo Base64');
    }
    const binary = atob(response.content.replace(/\s+/g, ''));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  async function repoJson(path) {
    if (!validPath(path)) throw new Error('Ruta de archivo no permitida: ' + path);
    const nonce = Date.now() + '_' + Math.random().toString(36).slice(2);
    const attempts = path === MODELS_PATH
      ? [
          ['GitHub API', () => apiJson(path, nonce)],
          ['GitHub RAW', () => fetchJson(RAW + path + '?_=' + nonce)]
        ]
      : [
          ['GitHub RAW', () => fetchJson(RAW + path + '?_=' + nonce)],
          ['GitHub API', () => apiJson(path, nonce)]
        ];
    const errors = [];
    for (const [source, load] of attempts) {
      try { return await load(); }
      catch (error) { errors.push(source + ': ' + error.message); }
    }
    throw new Error('No se pudo leer ' + path.split('/').pop() +
      ' desde GitHub (' + errors.join('; ') + ')');
  }

  function sphereGeometry(params) {
    // Los vértices se generan al cargar sphere.mesh, igual que en PYRION Engine.
    const rings = Number(params?.rings), segments = Number(params?.segments), radius = Number(params?.radius);
    if (!Number.isInteger(rings) || !Number.isInteger(segments) ||
        rings < 4 || rings > 128 || segments < 6 || segments > 256 ||
        !Number.isFinite(radius) || radius <= 0) {
      throw new Error('Parámetros de esfera no válidos');
    }
    const vertices = [[0,radius,0]], faces = [];
    for (let i=1;i<rings;i++) {
      const theta = Math.PI*i/rings, h=radius*Math.cos(theta), r=radius*Math.sin(theta);
      for (let j=0;j<segments;j++) {
        const lon=2*Math.PI*j/segments;
        vertices.push([r*Math.cos(lon),h,r*Math.sin(lon)]);
      }
    }
    const south=vertices.length;
    vertices.push([0,-radius,0]);
    for (let j=0;j<segments;j++) {
      const next=(j+1)%segments;
      faces.push([0,1+j,1+next]);
    }
    for (let i=1;i<rings-1;i++) for (let j=0;j<segments;j++) {
      const next=(j+1)%segments;
      const a=1+(i-1)*segments+j, b=1+(i-1)*segments+next;
      const c=1+i*segments+j, d=1+i*segments+next;
      faces.push([a,c,d],[a,d,b]);
    }
    for (let j=0;j<segments;j++) {
      const next=(j+1)%segments;
      faces.push([1+(rings-2)*segments+j,south,1+(rings-2)*segments+next]);
    }
    // PYRION usa estas caras para renderizado interno; aquí orientamos las
    // normales hacia fuera para que el visor dibuje sus caras externas.
    for (const f of faces) {
      const a=vertices[f[0]],b=vertices[f[1]],c=vertices[f[2]];
      const ab=[b[0]-a[0],b[1]-a[1],b[2]-a[2]];
      const ac=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
      const n=cross(ab,ac);
      const center=[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3,(a[2]+b[2]+c[2])/3];
      if (dot(n,center) < 0) [f[1],f[2]]=[f[2],f[1]];
    }
    return {vertices,faces};
  }

  function checkMesh(source, scale) {
    if (!source || source.format!=='pyrion.mesh') throw new Error('Formato .mesh no válido');
    let geometry;
    if (source.primitive==='triangle_mesh') {
      geometry = {vertices:source.vertices,faces:source.faces};
    } else if (source.primitive==='uv_sphere') {
      geometry = sphereGeometry(source.parameters);
    } else throw new Error('Tipo de malla no compatible: ' + source.primitive);
    if (!Array.isArray(geometry.vertices) || !Array.isArray(geometry.faces) ||
        geometry.vertices.length<3 || geometry.vertices.length>12000 ||
        geometry.faces.length<1 || geometry.faces.length>20000 ||
        geometry.vertices.some(v=>!Array.isArray(v) || v.length!==3 || v.some(n=>!Number.isFinite(n))) ||
        geometry.faces.some(f=>!Array.isArray(f) || f.length!==3 || f.some(i=>!Number.isInteger(i)||i<0||i>=geometry.vertices.length))) {
      throw new Error('La malla contiene vértices o triángulos inválidos');
    }
    const factors=Array.isArray(scale) && scale.length===3 &&
      scale.every(v=>Number.isFinite(v)&&v>0) ? scale : [1,1,1];
    return {
      vertices:geometry.vertices.map(v=>v.map((n,i)=>n*factors[i])),
      faces:geometry.faces
    };
  }

  function sub(a,b) {return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
  function dot(a,b) {return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
  function cross(a,b) {return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
  function unit(a) {const r=Math.hypot(...a)||1;return a.map(n=>n/r);}
  const light=unit([-.45,.72,1]),light2=unit([.8,-.18,.65]);

  function render() {
    ctx.clearRect(0,0,width,height);
    const background=ctx.createRadialGradient(width/2,height/2,3,width/2,height/2,Math.max(width,height)*.62);
    background.addColorStop(0,'#29213e');background.addColorStop(1,'#101424');
    ctx.fillStyle=background;ctx.fillRect(0,0,width,height);
    if (!active) return;
    const vs=active.geometry.vertices, fs=active.geometry.faces;
    const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
    const bounds=[0,1,2].map(i=>[Math.min(...vs.map(v=>v[i])),Math.max(...vs.map(v=>v[i]))]);
    const center=bounds.map(b=>(b[0]+b[1])/2);
    const points=vs.map(v=>{
      const x=v[0]-center[0],y=v[1]-center[1],z=v[2]-center[2];
      const rx=x*cy+z*sy,rz=-x*sy+z*cy;
      return [rx,y*cp-rz*sp,y*sp+rz*cp];
    });
    // Escala constante durante la rotacion: evita que el modelo pulse
    // o cambie de tamaño al girar sobre el eje vertical.
    const xSpan=bounds[0][1]-bounds[0][0];
    const ySpan=bounds[1][1]-bounds[1][0];
    const zSpan=bounds[2][1]-bounds[2][0];
    const diameter=Math.hypot(xSpan,zSpan);
    const scale=Math.min(width*.78/Math.max(.1,diameter),
                         height*.76/Math.max(.1,ySpan*Math.cos(pitch)+diameter*Math.abs(Math.sin(pitch)))) * zoom;
    const screen=points.map(p=>{const k=4.8/(4.8-p[2]);return [width/2+p[0]*scale*k,height/2-p[1]*scale*k];});
    const col=active.color, metal=active.metallic, rough=active.roughness;
    const triangles=[];
    for (const f of fs) {
      const a=points[f[0]],b=points[f[1]],c=points[f[2]];
      const normal=unit(cross(sub(b,a),sub(c,a)));
      if (normal[2]<=0) continue;
      const brightness=.33+.71*Math.max(0,dot(normal,light))+.20*Math.max(0,dot(normal,light2));
      const shine=Math.pow(Math.max(0,dot(normal,unit([.1,.62,1]))),9+43*(1-rough))*(metal>.5?100:70);
      const color=col.map(v=>Math.min(255,Math.round(v*brightness+shine*(.6+metal*.4))));
      triangles.push({f,depth:(a[2]+b[2]+c[2])/3,fill:'rgb('+color.join(',')+')'});
    }
    triangles.sort((a,b)=>a.depth-b.depth);
    ctx.lineJoin='round';
    ctx.lineWidth=.65;
    ctx.strokeStyle=active.edge;
    for (const t of triangles) {
      const [a,b,c]=t.f.map(i=>screen[i]);
      ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.lineTo(...c);ctx.closePath();
      ctx.fillStyle=t.fill;ctx.fill();ctx.stroke();
    }
  }

  function resize() {
    const r=canvas.getBoundingClientRect();
    width=Math.max(1,r.width);height=Math.max(1,r.height);
    const d=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.round(width*d);canvas.height=Math.round(height*d);
    ctx.setTransform(d,0,0,d,0,0);
    render();
  }

  async function selectModel(model) {
    const request=++serial;
    for (const button of nav.querySelectorAll('button')) {
      button.setAttribute('aria-pressed',String(button.dataset.id===model.id));
    }
    active=null;render();
    status.textContent='Cargando '+model.name+' desde GitHub…';
    report('loading', 'Cargando malla de '+model.name+'...');
    try {
      const [source, material] = await Promise.all([
        repoJson(model.mesh),
        model.material ? repoJson(model.material).catch(()=>null) : Promise.resolve(null)
      ]);
      if (request!==serial) return;
      const geometry=checkMesh(source,model.scale);
      const colorText=material?.base_color || source.material?.base_color || '#8D55C2';
      const hex=/^#[0-9a-f]{6}$/i.test(colorText)?colorText:'#8D55C2';
      const color=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
      const metallic=Math.max(0,Math.min(1,Number(material?.metallic)||0));
      const roughness=Math.max(.04,Math.min(1,Number(material?.roughness)||.45));
      const edge=metallic>.6?'rgba(250,226,173,.22)':
                 (model.id==='dark_gem'?'rgba(183,192,214,.33)':'rgba(222,206,245,.28)');
      active={geometry,color,metallic,roughness,edge};
      status.textContent=model.name+' · '+geometry.vertices.length+' vértices · '+geometry.faces.length+' triángulos';
      render();
      report('ready', model.name+' · '+geometry.vertices.length+' vértices · '+geometry.faces.length+' triángulos');
    } catch (e) {
      if (request!==serial) return;
      status.textContent=e.message+' · Abre el HTML en un navegador con acceso a GitHub.';
      report('error', e.message);
    }
  }

  function buildMenu(models) {
    nav.replaceChildren();
    for (const model of models) {
      const button=document.createElement('button');
      button.type='button';button.textContent=model.name;
      button.dataset.id=model.id;
      button.setAttribute('aria-pressed','false');
      button.addEventListener('click',()=>selectModel(model));
      nav.appendChild(button);
    }
  }

  async function init() {
    try {
      report('loading', 'Consultando models.json...');
      const catalog=await repoJson(MODELS_PATH);
      if (!catalog || !Array.isArray(catalog.models) || !catalog.models.length) {
        throw new Error('models.json no tiene modelos registrados');
      }
      const models=catalog.models.filter(m=>m && typeof m.id==='string' &&
        typeof m.name==='string' && validPath(m.mesh) &&
        (!m.material || validPath(m.material)));
      if (!models.length) throw new Error('models.json no contiene rutas válidas');
      buildMenu(models);
      await selectModel(models[0]);
    } catch (e) {
      status.textContent=e.message;
      report('error',e.message);
    }
  }

  slider.addEventListener('input',()=>{
    zoom=Number(slider.value)/100;
    value.textContent=slider.value+'%';render();
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    slider.value=String(Math.min(220,Math.max(50,Number(slider.value)+(e.deltaY<0?10:-10))));
    slider.dispatchEvent(new Event('input'));
  },{passive:false});
  if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
  else window.addEventListener('resize',resize);

  // Animacion propia del visor: recarga de modelos y zoom siguen funcionando.
  // Un solo bucle de animacion por pagina; no se crean bucles al cambiar modelo.
  let lastFrame=0;
  function animate(now) {
    if (!lastFrame) lastFrame=now;
    const elapsed=now-lastFrame;
    if (elapsed>=FRAME_INTERVAL) {
      lastFrame=now;
      if (active) {
        // requestAnimationFrame ya reduce la frecuencia si el visor no está visible.
        // No usar document.hidden: algunos visores integrados lo marcan oculto.
        yaw=(yaw+ROTATION_SPEED*Math.min(elapsed,100)/1000)%(2*Math.PI);
        rotationAngle.textContent='Giro '+Math.round(((yaw*180/Math.PI)%360+360)%360)+'°';
        render();
      }
    }
    requestAnimationFrame(animate);
  }
  resize();init();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
