<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PYRION - Visor crystal.mesh (GitHub)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c101d;color:#eee5fa;font:14px system-ui,Arial,sans-serif}
  main{width:min(100%,820px);padding:16px}
  canvas{display:block;width:100%;height:min(70vh,620px);min-height:290px;background:radial-gradient(circle,#282139,#101323 72%);border:1px solid #403453;border-radius:12px}
  label{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0 0}
  input{width:min(270px,55vw);accent-color:#ac83e5}
  output{min-width:42px}
  #status{margin:10px auto 0;text-align:center;min-height:36px;font-size:12px;color:#aca2c6;max-width:580px;line-height:1.45}
</style>
</head>
<body>
<main>
  <canvas id="visor" aria-label="Malla 3D de crystal.mesh"></canvas>
  <label for="zoom">Zoom <input id="zoom" type="range" min="50" max="220" value="100"><output id="valor">100%</output></label>
  <p id="status">Cargando crystal.mesh desde GitHub...</p>
</main>
<script>
(() => {
  // Este HTML NO contiene ni genera una malla: lee crystal.mesh del repositorio.
  const PATH = 'PYRION/engine3d/scenes/onlydeskplace/models/crystal.mesh';
  const RAW = 'https://raw.githubusercontent.com/mobatfb/archmoba-dev/main/' + PATH;
  const API = 'https://api.github.com/repos/mobatfb/archmoba-dev/contents/' + PATH + '?ref=main';
  const canvas = document.getElementById('visor');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('zoom');
  const output = document.getElementById('valor');
  const status = document.getElementById('status');
  let mesh = null, width = 1, height = 1, zoom = 1;
  const yaw = 0.55, pitch = 0.14;
  const unit = a => { const m = Math.hypot(...a) || 1; return a.map(v => v/m); };
  const sub = (a,b) => a.map((v,i)=>v-b[i]);
  const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const dot = (a,b) => a.reduce((s,v,i)=>s+v*b[i],0);
  const light = unit([-.5,.7,1]), light2 = unit([.7,-.2,1]);

  function redraw() {
    ctx.clearRect(0,0,width,height);
    if (!mesh) return;
    const vertices = mesh.vertices;
    const bounds = [0,1,2].map(k=>[
      Math.min(...vertices.map(p=>p[k])),
      Math.max(...vertices.map(p=>p[k]))
    ]);
    const center = bounds.map(([a,b])=>(a+b)/2);
    const scale = Math.min(
      width*.68/Math.max(.1,bounds[0][1]-bounds[0][0]),
      height*.77/Math.max(.1,bounds[1][1]-bounds[1][0])
    )*zoom;
    const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
    const transformed=vertices.map(p=>{
      const x=p[0]-center[0], y=p[1]-center[1], z=p[2]-center[2];
      const a=x*cy+z*sy, b=-x*sy+z*cy;
      return [a,y*cp-b*sp,y*sp+b*cp];
    });
    const screen=transformed.map(p=>{
      const perspective=4.8/(4.8-p[2]);
      return [width/2+p[0]*scale*perspective,height/2-p[1]*scale*perspective];
    });
    const faces=[];
    for (const face of mesh.faces) {
      const a=transformed[face[0]],b=transformed[face[1]],c=transformed[face[2]];
      const n=unit(cross(sub(b,a),sub(c,a)));
      if(n[2]<=0)continue;
      const brightness=Math.min(1.35,.24+.7*Math.max(0,dot(n,light))+.3*Math.max(0,dot(n,light2)));
      const glint=Math.pow(Math.max(0,dot(n,unit([.15,.7,1]))),25)*90;
      const color=[150,91,205].map((base,i)=>Math.min(255,Math.round(base*brightness+glint*(i===1?.8:1))));
      faces.push({face,depth:(a[2]+b[2]+c[2])/3,color:`rgb(${color.join(',')})`});
    }
    faces.sort((a,b)=>a.depth-b.depth);
    ctx.lineJoin='round';
    for (const item of faces) {
      const [a,b,c]=item.face.map(i=>screen[i]);
      ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.lineTo(...c);ctx.closePath();
      ctx.fillStyle=item.color;ctx.fill();
      ctx.lineWidth=.8;ctx.strokeStyle='rgba(234,204,255,.67)';ctx.stroke();
    }
  }
  function resize(){
    const rect=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
    width=Math.max(1,rect.width);height=Math.max(1,rect.height);
    canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);redraw();
  }
  slider.addEventListener('input',()=>{
    zoom=Number(slider.value)/100;output.textContent=slider.value+'%';redraw();
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    slider.value=String(Math.min(220,Math.max(50,Number(slider.value)+(e.deltaY<0?10:-10))));
    slider.dispatchEvent(new Event('input'));
  },{passive:false});
  if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas);
  else window.addEventListener('resize',resize);
  resize();

  async function get(url){
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),8000);
    try{
      const response=await fetch(url,{mode:'cors',cache:'no-store',signal:controller.signal});
      if(!response.ok)throw Error('HTTP '+response.status);
      return await response.json();
    }finally{clearTimeout(timeout);}
  }
  function validate(data){
    if(data?.format!=='pyrion.mesh'||data?.primitive!=='triangle_mesh'
        ||!Array.isArray(data.vertices)||!Array.isArray(data.faces)
        ||!data.vertices.length||!data.faces.length
        ||data.vertices.some(v=>!Array.isArray(v)||v.length!==3||v.some(n=>!Number.isFinite(n)))
        ||data.faces.some(f=>!Array.isArray(f)||f.length!==3||f.some(i=>!Number.isInteger(i)||i<0||i>=data.vertices.length))){
      throw Error('El archivo no contiene una malla triangular PYRION válida.');
    }
    return data;
  }
  async function load(){
    let errorRaw='',errorApi='';
    try{
      mesh=validate(await get(RAW));
      status.textContent=`${mesh.vertices.length} vértices · ${mesh.faces.length} triángulos · GitHub RAW`;
      redraw();return;
    }catch(e){errorRaw=e.message;}
    status.textContent='Intentando acceder al archivo mediante la API de GitHub...';
    try{
      const info=await get(API);
      if(typeof info.content!=='string'||info.encoding!=='base64')throw Error('La API no entregó el archivo en Base64.');
      const binary=atob(info.content.replace(/\s/g,''));
      const bytes=Uint8Array.from(binary,ch=>ch.charCodeAt(0));
      mesh=validate(JSON.parse(new TextDecoder().decode(bytes)));
      status.textContent=`${mesh.vertices.length} vértices · ${mesh.faces.length} triángulos · GitHub API`;
      redraw();return;
    }catch(e){errorApi=e.message;}
    status.textContent='No se pudo conectar con GitHub desde este navegador o visor. Abre este HTML directamente en Chrome o Firefox con internet. (RAW: '+errorRaw+'; API: '+errorApi+')';
  }
  load();
})();
</script>
</body>
</html>
